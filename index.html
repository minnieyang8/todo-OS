<style>
:root{--bg:#F7F7F2;--bg2:#EEF2F0;--sf:#fff;--tx:#26332F;--tx2:#5b6862;--ac:#78947D;--acd:#4f7258;--acl:#E6EEE5;--bd:#DCE3DD;--sh:0 1px 3px rgba(38,51,47,.08)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b211f;--bg2:#222a27;--sf:#27302c;--tx:#eef2ee;--tx2:#a9b6af;--ac:#8fb096;--acd:#8fb096;--acl:#2f3d34;--bd:#3a463f}}
:root[data-theme="dark"]{--bg:#1b211f;--bg2:#222a27;--sf:#27302c;--tx:#eef2ee;--tx2:#a9b6af;--ac:#8fb096;--acd:#8fb096;--acl:#2f3d34;--bd:#3a463f}
*{box-sizing:border-box}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font:16px/1.5 "DM Sans",Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--tx);overflow-x:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;min-height:40px}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--acd);outline-offset:2px}
.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
aside{border-right:1px solid var(--bd);background:var(--bg2);padding:18px 12px;position:sticky;top:0;height:100vh;overflow:auto}
.logo{display:flex;align-items:center;gap:10px;font-weight:600;font-size:19px;padding:4px 8px 16px}
.logo i{width:32px;height:32px;border-radius:10px;background:var(--ac);color:#fff;display:grid;place-items:center;font-style:normal;font-weight:700}
aside button{display:block;width:100%;text-align:left;padding:10px 12px;border-radius:12px;color:var(--tx2)}
aside button.on{background:var(--acl);color:var(--tx);font-weight:600}
main{padding:18px 22px 110px;max-width:980px;width:100%}
.hd{display:flex;align-items:flex-start;gap:12px;margin-bottom:18px;flex-wrap:wrap}.hd h1{margin:0;font-size:27px;font-weight:600}.hd p{margin:0;color:var(--tx2)}.hd div{flex:1}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:18px;box-shadow:var(--sh);margin-bottom:16px;animation:fi .25s both}
@keyframes fi{from{opacity:0}}
.card h2{margin:0 0 8px;font-size:19px;font-weight:600}.sec{color:var(--tx2);font-size:14px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:16px}.g2 .card{margin:0}
.row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--bd)}.row:last-child{border:0}
.rt{flex:1;min-width:0;text-align:left}.rt b{display:block;font-weight:500;overflow-wrap:anywhere}.rt small{color:var(--tx2);font-size:14px}.od{color:#a8403c;font-weight:600}
.ck{width:28px;height:28px;min-height:28px;border-radius:50%;border:2px solid var(--ac);flex:none;display:grid;place-items:center;color:#fff;font-size:15px;transition:.2s}
.row.dn .ck{background:var(--acd)}.row.dn .rt b{text-decoration:line-through;color:var(--tx2)}
.pr{font-size:12.5px;padding:2px 9px;border-radius:99px;border:1px solid var(--bd);border-left:5px solid;white-space:nowrap}
.p1{border-left-color:#C85D59}.p2{border-left-color:#D99A43}.p3{border-left-color:#D9BB58}.p4{border-left-color:#7A9C79}
.chip{padding:3px 11px;min-height:30px;border-radius:99px;background:var(--acl);font-size:14px}
.subs{margin:0 0 6px 38px}.sr{display:flex;gap:8px;padding:4px 0;font-size:15px}
.b{padding:10px 18px;border-radius:12px;background:var(--acd);color:#fff;font-weight:500}.b.q{background:transparent;border:1px solid var(--bd);color:var(--tx)}.b.s{padding:6px 12px;min-height:34px;font-size:14px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.tabs button{padding:6px 14px;border-radius:99px;border:1px solid var(--bd);font-size:15px}.tabs button.on{background:var(--acl);border-color:var(--ac);font-weight:600}
input,select,textarea{font:inherit;color:var(--tx);background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;width:100%;min-height:42px}
label{display:grid;gap:4px;font-size:14px;color:var(--tx2)}.f{display:grid;gap:12px}.r2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
details>summary{cursor:pointer;padding:6px 0;font-weight:500}.empty{color:var(--tx2);padding:8px 0}
.bar{height:8px;border-radius:9px;background:var(--bd);overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center}.cal span{font-size:13px;color:var(--tx2)}
.cal button{aspect-ratio:1;min-height:36px;border-radius:10px;position:relative;font-size:15px}.cal .t{box-shadow:inset 0 0 0 1.5px var(--ac)}.cal .s{background:var(--acd);color:#fff}.cal i{position:absolute;bottom:3px;left:50%;margin-left:-2px;width:4px;height:4px;border-radius:50%;background:var(--ac)}.cal .s i{background:#fff}
.fab{position:fixed;right:max(18px,env(safe-area-inset-right));bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:20;width:58px;height:58px;border-radius:50%;background:var(--acd);color:#fff;font-size:30px;box-shadow:0 6px 18px rgba(38,51,47,.25)}
@media(min-width:900px){.fab{bottom:28px}}
.bn{display:none;position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--sf);border-top:1px solid var(--bd);padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px))}
.bn button{flex:1;font-size:13px;color:var(--tx2);padding:6px 2px}.bn button.on{color:var(--acd);font-weight:700}
@media(max-width:899px){.app{display:block}aside{display:none}.bn{display:flex}main{padding:14px 14px 130px}.g2{grid-template-columns:1fr}.hd h1{font-size:23px}}
.ov{position:fixed;inset:0;z-index:30;background:rgba(30,40,36,.4);display:none;justify-content:flex-end}.ov.on{display:flex}.ov.c{justify-content:center;align-items:center;padding:16px}
.pn{width:min(480px,100%);height:100%;overflow:auto;background:var(--bg);padding:20px;animation:sl .25s both}.ov.c .pn{height:auto;max-height:90vh;border-radius:18px}@keyframes sl{from{transform:translateX(24px);opacity:0}}
.pn h2{margin:0 0 14px}.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:50;background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:12px;display:none;max-width:90vw}
#al{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);width:min(440px,calc(100% - 20px));z-index:60;display:grid;gap:8px}.al{background:var(--sf);border:1px solid var(--ac);border-radius:14px;padding:14px;box-shadow:0 6px 20px rgba(0,0,0,.18)}
.mn{display:grid;grid-template-columns:1fr 1fr;gap:10px}.mn button{border:1px solid var(--bd);border-radius:14px;background:var(--sf);padding:16px;text-align:left}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

:root{--serif:"Cormorant Garamond","Playfair Display",Georgia,serif}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(45vw 45vh at 0% 0%,rgba(168,214,176,.38),transparent),radial-gradient(45vw 45vh at 100% 100%,rgba(190,215,235,.3),transparent)}
aside{background:linear-gradient(170deg,rgba(196,230,203,.6),var(--bg2) 55%)}

.wm{position:relative;font-family:var(--serif);font-weight:600;font-size:36px;line-height:1;color:#fff;letter-spacing:-.01em;text-shadow:0 1px 8px rgba(45,92,60,.5)}
.lg .sp{position:absolute;top:8px;right:10px;width:15px;height:15px;fill:#fff;filter:drop-shadow(0 0 4px rgba(255,255,255,.7))}
.lg .sp2{position:absolute;bottom:8px;right:13px;width:9px;height:9px;fill:rgba(255,255,255,.6)}
.lg.sm{padding:9px 28px 8px 14px;margin:0;border-radius:16px}.lg.sm .wm{font-size:26px}.lg.sm .sp{width:11px;height:11px;top:6px;right:8px}
.mb{display:none;padding:10px 14px 0}
.hd h1{font-family:var(--serif);font-size:36px;font-weight:600;line-height:1.1}
.card h2,.pn h2{font-family:var(--serif);font-size:24px;font-weight:600;letter-spacing:-.005em}
.mn button{font-family:var(--serif);font-size:20px;font-weight:600}
@media(max-width:899px){.mb{display:block}.hd h1{font-size:30px}}
.er{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;align-items:end;margin-bottom:10px}.ok{color:var(--acd);font-weight:500}
.tg{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:16px}
@media(min-width:600px){.tg{grid-template-columns:repeat(3,1fr)}}@media(min-width:1100px){.tg{grid-template-columns:repeat(4,1fr)}}
.tl{aspect-ratio:1/.95;min-height:128px;border-radius:20px;background:var(--sf);border:1px solid var(--bd);box-shadow:var(--sh);padding:14px 14px 16px;display:flex;flex-direction:column;align-items:flex-start;text-align:left;position:relative;overflow:hidden;transition:transform .2s}.tl:hover{transform:translateY(-2px)}
.tl::after{content:"↗";position:absolute;top:12px;right:14px;color:var(--tx2);font-size:15px}.tl::before{content:"";position:absolute;left:16px;right:16px;bottom:0;height:3px;border-radius:3px 3px 0 0;background:var(--c)}
.ti{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 24%,transparent)}.ti svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tt{margin-top:8px;font-size:14px;color:var(--tx2);font-weight:500}.tn{font-family:var(--serif);font-weight:600;font-size:40px;line-height:1.05;margin-top:auto}.tl small{color:var(--tx2);font-size:13px;line-height:1.25}
</style></head>

<div class="mb"><div class="lg sm"><span class="wm">Todo OS</span><svg class="sp" viewBox="0 0 24 24"><path d="M12 0C13 7 17 11 24 12 17 13 13 17 12 24 11 17 7 13 0 12 7 11 11 7 12 0Z"/></svg></div></div>
<div class="app"><aside><div class="lg"><span class="wm">Todo OS</span><svg class="sp" viewBox="0 0 24 24"><path d="M12 0C13 7 17 11 24 12 17 13 13 17 12 24 11 17 7 13 0 12 7 11 11 7 12 0Z"/></svg><svg class="sp2" viewBox="0 0 24 24"><path d="M12 0C13 7 17 11 24 12 17 13 13 17 12 24 11 17 7 13 0 12 7 11 11 7 12 0Z"/></svg></div><div id="sn"></div></aside><main id="main"></main></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const e=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0'),iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`,loc=d=>iso(d)+'T'+pad(d.getHours())+':'+pad(d.getMinutes());
const td=()=>iso(new Date()),pd=s=>new Date(s+'T00:00'),add=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return iso(d)};
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
const fd=s=>{const n=Math.round((pd(s)-pd(td()))/864e5);return n===0?'Today':n===1?'Tomorrow':n===-1?'Yesterday':pd(s).toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short'})};
const AREA={pro:'Professional',per:'Personal',par:'Parenting',net:'NET Cracker',oth:'Other'},AO=Object.entries(AREA);
const PRI=['','Critical','Important','Normal','Optional'],DOT=['','🔴','🟠','🟡','🟢'],PO=[1,2,3,4].map(i=>[i,DOT[i]+' '+PRI[i]]);
const ST=['Not started','Learning','PYQ practice','Revised','Strong'],ACT=['Learning','Revision','PYQ practice','Mock test','Error review'],ERR=['Concept gap','Careless error','Time pressure','Misread question','Guess'];
const DAYS=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'],DO=DAYS.map((d,i)=>[i,d]);
const RM=['','I','II','III','IV','V','VI','VII','VIII'],PD=[[0,'None'],...[1,2,3,4,5,6,7,8].map(i=>[i,RM[i]])];
const REM=[[0,'At the time'],[10,'10 minutes before'],[30,'30 minutes before'],[60,'1 hour before'],[1440,'1 day before']];
const TOP={I:['Teaching Aptitude','Research Aptitude','Communication','Reasoning','ICT','Data Interpretation','Higher Education','Environment','Other Paper I topics'],II:['Accounting','Finance','Income Tax','Cost Accounting','Management Accounting','Marketing','Human Resource Management','International Business','Research','Other Commerce topics']};
const LB={task:'task',event:'event',class:'class',note:'note',study:'study session',pyq:'PYQ practice',mock:'mock test',topic:'topic'};
const mk=(type,o)=>Object.assign({id:uid(),type,title:'',area:'pro',group:'',pri:3,due:'',time:'',end:'',dur:0,notes:'',url:'',subs:[],rem:[],remC:'',rec:null,done:false,arch:false,created:Date.now()},o||{});
const DEF={task:{},event:{},class:{day:1,area:'pro',period:0},note:{},study:{act:'Learning',area:'net'},pyq:{att:0,cor:0,err:'',area:'net'},mock:{paper:'I',score:0,max:100,area:'net'},topic:{paper:'I',status:0,area:'net'}};
function fresh(){const r=[];Object.entries(TOP).forEach(([p,l])=>l.forEach(n=>r.push(mk('topic',{title:n,paper:p,status:0,area:'net'}))));return{set:{name:'Sumi',cls:30,tm:30,tq:20,kids:['Daughter','Son']},recs:r,fired:{},log:[],keep:{}}}
let S;try{S=JSON.parse(localStorage.getItem('todoos_sumi'))}catch(x){}
if(!S||!S.recs)S=fresh();
const save=()=>{S.ts=Date.now();schedPush();try{localStorage.setItem('todoos_sumi',JSON.stringify(S))}catch(x){toast('Could not save on this device. Please export a backup.')}};
const R=()=>S.recs.filter(r=>!r.draft),byId=id=>R().find(r=>r.id===id),ty=t=>R().filter(r=>r.type===t&&!r.arch);
let view='today',st={tab:'today',area:'all',pri:'all',date:'',g:'',cmode:'month',sel:td(),mo:td().slice(0,7),wk:0,q:''},X=new Set(),F=null,tt;
const toast=m=>{const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(tt);tt=setTimeout(()=>t.style.display='none',3500)};
/* logic */
const acc=(c,a)=>a>0?Math.round(c/a*100)+'%':'—';
function nextDue(d,rc){const x=pd(d),n=rc.n||1;if(rc.f==='d')x.setDate(x.getDate()+n);else if(rc.f==='w')x.setDate(x.getDate()+7*n);else if(rc.f==='m'){const dd=x.getDate();x.setDate(1);x.setMonth(x.getMonth()+n);x.setDate(Math.min(dd,new Date(x.getFullYear(),x.getMonth()+1,0).getDate()))}else x.setFullYear(x.getFullYear()+n);return iso(x)}
function complete(id){const r=byId(id);r.done=true;r.doneAt=Date.now();if(r.rec&&r.due){r.series=r.series||r.id;const nd=nextDue(r.due,r.rec);if(!R().some(x=>x.series===r.series&&x.due===nd&&!x.done&&x!==r))S.recs.push(Object.assign({},r,{id:uid(),due:nd,done:false,doneAt:null,subs:r.subs.map(s=>({...s,d:false})),created:Date.now()}))}save();render();toast(['That’s taken care of.','Done. One less thing to carry.','Nicely done.'][Math.floor(Math.random()*3)])}
const dueAt=r=>r.due?new Date(r.due+'T'+(r.time||'09:00')):null;
function remTimes(r){if(r.done||r.arch||!['task','event'].includes(r.type))return[];const d=dueAt(r),o=[];if(d)(r.rem||[]).forEach(m=>o.push(new Date(d-m*6e4)));if(r.remC)o.push(new Date(r.remC));return o}
function agenda(d){const dow=pd(d).getDay(),a=[];R().forEach(r=>{if(r.arch)return;if(r.type==='class'&&r.day===dow&&(!r.from||d>=r.from)&&(!r.to||d<=r.to)&&!(r.skip||[]).includes(d))a.push({r,k:'class'});else if(r.type==='event'&&r.due===d)a.push({r,k:'event'});else if(r.type==='task'&&!r.done&&r.due===d)a.push({r,k:'task'})});return a.sort((x,y)=>(x.r.time||(x.r.period?'0'+x.r.period:'99'))>(y.r.time||(y.r.period?'0'+y.r.period:'99'))?1:-1)}
const tStats=t=>{const s=ty('study').filter(x=>x.topic===t.id),p=ty('pyq').filter(x=>x.topic===t.id);return{min:s.reduce((a,x)=>a+x.dur,0),last:[...s,...p].map(x=>x.due).sort().pop()||'',att:p.reduce((a,x)=>a+x.att,0),cor:p.reduce((a,x)=>a+x.cor,0)}};
const tName=id=>{const t=byId(id);return t?t.title:'(removed topic)'};
function tick(){const now=Date.now(),hit=[];R().forEach(r=>remTimes(r).forEach(t=>{const k=r.id+'@'+t.getTime();if(S.fired[k]||t>now)return;S.fired[k]=1;if(now-t<432e5)hit.push({k,id:r.id,x:`${r.type==='task'?PRI[r.pri]+': ':''}${r.title}${r.type==='event'?' starts':' is due'}${r.due?' '+fd(r.due)+(r.time?' at '+r.time:''):''}.`})}));
 const d=td();agenda(d).filter(a=>a.k==='class'&&a.r.time).forEach(a=>{const st0=new Date(d+'T'+a.r.time),t=new Date(st0-S.set.cls*6e4),k='c'+a.r.id+d;if(S.fired[k]||now<t||now>st0)return;S.fired[k]=1;hit.push({k,x:`Class in ${Math.max(1,Math.round((st0-now)/6e4))} minutes — ${a.r.title}${a.r.cls?' ('+a.r.cls+')':''}${a.r.room?'. Room: '+a.r.room:''}`})});
 if(hit.length){hit.forEach(h=>{let via='in-app';if('Notification' in window&&Notification.permission==='granted'){try{new Notification('Reminder',{body:h.x});via='in-app + device request sent'}catch(x){}}S.log.unshift({t:Date.now(),x:h.x,via});});S.log=S.log.slice(0,40);save();$('#al').innerHTML+=hit.map(h=>`<div class="al"><b>🔔 Reminder</b><div>${e(h.x)}</div><div class="acts">${h.id?`<button class="b s" data-a="snz" data-i="${h.id}">Snooze 10 min</button>`:''}<button class="b s q" data-a="dis">Dismiss</button></div></div>`).join('')}}
/* forms */
const T=(k,l,t,o,m)=>[k,l,t,o];
const FS={task:[[['title','What needs doing?','t'],['area','Area','s',AO],['pri','Priority','s',PO],['due','Due date','d'],['time','Due time (optional)','tm']],[['group','Subject, project or person','t'],['dur','Estimated minutes','n'],['url','Link','t'],['notes','Notes','x']]],
event:[[['title','Event','t'],['area','Area','s',AO],['due','Date','d'],['time','Start','tm'],['end','End','tm']],[['group','Person or project','t'],['url','Link','t'],['notes','Notes','x']]],
class:[[['title','Subject','t'],['day','Day','s',DO],['period','Period (optional)','s',PD],['time','Start','tm'],['end','End','tm'],['area','Timetable','s',[['pro','College'],['par','Child'],['per','Personal']]]],[['sem','Semester','t'],['cls','Class','t'],['room','Room','t'],['group','Child or activity','t'],['from','Effective from','d'],['to','Effective until','d'],['notes','Notes','x']]],
note:[[['title','Title','t'],['area','Area','s',AO],['group','Subject or person','t'],['notes','Note','x']],[]],
study:[[['topic','Topic','tp'],['due','Date','d'],['dur','Minutes','n'],['act','Activity','s',ACT.map(a=>[a,a])]],[['notes','Notes','x']]],
pyq:[[['topic','Topic','tp'],['due','Date','d'],['att','Questions attempted','n'],['cor','Correct answers','n']],[['err','Main mistake type','s',[['','—'],...ERR.map(a=>[a,a])]],['notes','Mistakes to revisit','x']]],
mock:[[['title','Test name','t'],['due','Date','d'],['paper','Paper','s',[['I','Paper I'],['II','Paper II']]],['score','Score','n'],['max','Maximum','n']],[['notes','Notes','x']]],
